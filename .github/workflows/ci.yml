name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  schedule:
    # Every Monday at 00:00 UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x
  PNPM_VERSION: 12.16.1
  JUST_VERSION: 1.59.0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install just
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Setup pnpm with ${{ env.PNPM_VERSION }} version
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with ${{ env.NODE_VERSION }} version
        uses: actions/setup-node@v7.1.0
        with:
          cache: 'pnpm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies (Biome and tombi)
        run: pnpm install --frozen-lockfile --filter @auto-palette/monorepo

      - name: Check formatting
        run: just format-check

      - name: Lint .js and .ts files
        run: just lint-js

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install just and cargo-udeps
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}, cargo-udeps

      - name: Lint with clippy
        run: just lint-rust

      - name: Check for unused dependencies
        run: just udeps

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install just and cargo-audit
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}, cargo-audit

      - name: Check for security vulnerabilities
        run: just audit

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just and cargo-hack
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}, cargo-hack

      - name: Check with the rust-version in Cargo.toml
        run: just msrv

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  test-lib:
    name: "test auto-palette crate on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NEXTEST_RETRIES: 2
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just, cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}, cargo-nextest, cargo-llvm-cov

      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: just test-lib

      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: just coverage --codecov --output-path codecov.json

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

      - name: Run doc tests
        if: matrix.os == 'ubuntu-latest'
        run: just test-doc

      - name: Run examples
        if: matrix.os == 'ubuntu-latest'
        run: just examples

  test-cli:
    name: "test auto-palette-cli crate on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}, cargo-nextest

      - name: Run unit tests
        run: just test-cli

  test-wasm:
    name: "test auto-palette-wasm crate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just and cargo-binstall
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}, cargo-binstall

      - name: Install wasm-bindgen-cli
        run: cargo binstall wasm-bindgen-cli --no-confirm

      - name: Run unit tests
        run: just test-wasm

  build-lib:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Build library in release mode
        run: just build-lib

  build-cli:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Build CLI in release mode
        run: just build-cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: auto-palette
          path: target/release/auto-palette-cli

  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm with ${{ env.PNPM_VERSION }} version
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with ${{ env.NODE_VERSION }} version
        uses: actions/setup-node@v7.1.0
        with:
          cache: 'pnpm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install just
        uses: taiki-e/install-action@v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter @auto-palette/wasm test:e2e:install

      - name: Build the wasm package
        run: just build-wasm

      - name: Run the unit tests and e2e tests
        run: just test-wasm-js-all
