pre-commit:
  parallel: true
  jobs:
    - name: format rust
      glob: "**/*.rs"
      run: cargo +nightly fmt --all --
      stage_fixed: true

    - name: format js
      glob: "**/*.{js,ts,json}"
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true

    - name: format toml
      glob: "**/*.toml"
      run: pnpm exec tombi format {staged_files}
      stage_fixed: true

    - name: format markdown
      glob: "**/*.md"
      # Fix what it can, and leave the rest to the pre-push lint.
      run: pnpm exec markdownlint-cli2 --fix {staged_files} || true
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: lint rust
      glob: "**/*.rs"
      run: just lint-rust

    - name: lint js
      glob: "**/*.{js,ts}"
      run: pnpm exec biome lint {push_files}

    - name: lint markdown
      glob: "**/*.md"
      run: pnpm exec markdownlint-cli2 {push_files}
