[workspace]
resolver = "2"
members  = ["crates/*"]

[workspace.package]
version    = "0.9.2"
authors    = ["Tatsuya Maki <t28oogle@gmail.com>"]
edition    = "2021"
homepage   = "https://github.com/t28hub/auto-palette"
repository = "https://github.com/t28hub/auto-palette"
license    = "MIT"

[workspace.dependencies]
anyhow             = "1.0.104"
arboard            = "3.7.0"
assert_cmd         = "2.2.2"
auto-palette       = { path = "crates/auto-palette", version = "0.9.2", default-features = false }
clap               = { version = "4.6.7", features = ["cargo"] }
divan              = { package = "codspeed-divan-compat", version = "6.0.0" }
image              = { version = "0.25.9", default-features = false }
num-traits         = "0.2.19"
predicates         = "3.1.4"
rstest             = "0.28.0"
rustc-hash         = "2.1.3"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.154"
serde_test         = "1.0.177"
serde-wasm-bindgen = "0.6.5"
thiserror          = "2.0.21"
wasm-bindgen       = "0.2.130"
wasm-bindgen-test  = "0.3.80"
web-sys            = "0.3.107"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = "z"
lto       = true

[profile.test]
opt-level = 3
