packages:
  - packages/*

saveExact: true

# These install scripts were already skipped under pnpm 10. `lefthook install` runs from `prepare`.
allowBuilds:
  auto-palette: false
  lefthook: false
  wasm-pack: false

minimumReleaseAge: 4320 # 3 days in minutes

minimumReleaseAgeExclude:
  - "esbuild"
  - "@esbuild/*"

catalog:
    '@types/node': 26.6.5
    typescript: 7.0.2
    vitest: 5.0.5
    '@vitest/ui': 5.0.5
    '@vitest/coverage-v8': 5.0.5
    '@vitest/browser-playwright': 5.0.5
