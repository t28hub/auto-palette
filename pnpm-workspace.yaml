packages:
  - packages/*

saveExact: true

# These install scripts were already skipped under pnpm 10. `lefthook install` runs from `prepare`.
allowBuilds:
  auto-palette: false
  lefthook: false
  wasm-pack: false

minimumReleaseAge: 4320 # 3 days in minutes

overrides:
  # GHSA-238p-pmpm-9mq7: markdownlint pulls katex through micromark-extension-math, which asks for ^0.16.
  "katex@<0.18.2": "^0.19.1"

minimumReleaseAgeExclude:
  - "esbuild"
  - "@esbuild/*"

catalog:
    '@types/node': 26.6.6
    typescript: 7.0.2
    vitest: 5.1.1
    '@vitest/ui': 5.0.5
    '@vitest/coverage-v8': 5.1.0
    '@vitest/browser-playwright': 5.1.1
